services:
  not:
    build: .
    image: not-server:dev
    restart: unless-stopped
    environment:
      NOT_TOKEN: ${NOT_TOKEN:?set NOT_TOKEN in .env (openssl rand -hex 32)}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - not-data:/data
    ports:
      - "8080:8080"

volumes:
  not-data:
