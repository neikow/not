services:
  not:
    build: .
    image: not-server:dev
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      # URL devices use to reach the server; lets `not-server pair` print a QR code.
      NOT_PUBLIC_URL: ${NOT_PUBLIC_URL:-}
    volumes:
      - not-data:/data
    ports:
      - "8080:8080"

volumes:
  not-data:
