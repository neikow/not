[package]
name = "not-server"
version.workspace = true
edition.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
not-protocol = { version = "0.1.0", path = "../not-protocol" }
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
not-core = { path = "../not-core", features = ["net"] }
tokio-tungstenite = "0.30.0"
