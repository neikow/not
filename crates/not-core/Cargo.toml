[package]
name = "not-core"
version.workspace = true
edition.workspace = true

[dependencies]
loro = "1.17.1"
not-protocol = { version = "0.1.0", path = "../not-protocol" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"], optional = true }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"], optional = true }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["std"], optional = true }
serde_json = "1.0.154"

[features]
net = [
    "dep:reqwest",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
]

[dev-dependencies]
not-protocol = { path = "../not-protocol" }
