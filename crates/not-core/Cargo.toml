[package]
name = "not-core"
version.workspace = true
edition.workspace = true

[dependencies]
loro = "1.17.1"
not-protocol = { version = "0.1.0", path = "../not-protocol" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"], optional = true }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[features]
net = ["dep:reqwest"]

[dev-dependencies]
not-protocol = { path = "../not-protocol" }
