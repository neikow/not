# Builds the Mac app on demand (Actions → "Mac app" → Run workflow): Apple-silicon, ad-hoc
# signed (no paid developer account, ADR 0005), zipped, and attached to a GitHub release (the
# latest by default) as not-mac-<version>.zip. Manual only: macOS minutes cost 10× on private repos.
#
# The app isn't notarized: after unzipping, right-click not.app → Open the first time (or
# `xattr -dr com.apple.quarantine not.app`).
name: Mac app

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to attach the app to (empty: the latest)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write # attach to the release
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: mac
      - run: brew install xcodegen

      - name: Pick the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.release }}
        run: |
          tag="${WANTED:-$(gh release list --limit 1 --json tagName -q '.[0].tagName')}"
          test -n "$tag" || { echo "::error::no release to attach to"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build the Rust core and Swift bindings
        run: ./scripts/build-apple.sh

      - name: Build not.app (Release)
        run: |
          cd apple && xcodegen generate --quiet && cd ..
          xcodebuild -project apple/Not.xcodeproj -scheme NotMac -configuration Release \
            -destination platform=macOS,arch=arm64 -derivedDataPath build/xcode \
            MARKETING_VERSION=${{ steps.release.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -quiet build
          app=build/xcode/Build/Products/Release/not.app
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/not-mac-${{ steps.release.outputs.version }}.zip"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag }}" "$RUNNER_TEMP/not-mac-${{ steps.release.outputs.version }}.zip" --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: not-mac-${{ steps.release.outputs.version }}
          path: ${{ runner.temp }}/not-mac-${{ steps.release.outputs.version }}.zip
