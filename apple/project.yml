# Generate the Xcode project with: xcodegen generate (from this directory).
name: Not
options:
  bundleIdPrefix: dev.lysen
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  NotCore:
    path: NotCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    NOT_SUPPORT_URL: "https://ko-fi.com/vitalyn"
targets:
  NotMac:
    type: application
    platform: macOS
    sources: [NotMac]
    dependencies:
      - package: NotCore
    info:
      path: NotMac/Info.plist
      properties:
        CFBundleDisplayName: not
        # From the build settings, so CI's release number shows in About and Finder.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSCalendarsFullAccessUsageDescription: Shows your calendar events beside your tasks in Today and Upcoming, read only.
        # Services menu: send text, links and pictures from any app (see Services.swift).
        NSServices:
          - NSMenuItem: { default: Add to not }
            NSMessage: addToNot
            NSPortName: not
            NSSendTypes: [public.utf8-plain-text, public.url, public.file-url, public.image, NSStringPboardType]
          - NSMenuItem: { default: New not Note }
            NSMessage: newNote
            NSPortName: not
            NSSendTypes: [public.utf8-plain-text, public.url, public.file-url, public.image, NSStringPboardType]
        CFBundleURLTypes:
          - CFBundleURLName: dev.lysen.not
            CFBundleURLSchemes: [not]
        # Settings → Support (Ko-fi); empty hides it. The Mac app isn't in a store, so no policy
        # stands in the way (Android keeps it out of Play builds).
        NotSupportURL: $(NOT_SUPPORT_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lysen.not
        PRODUCT_NAME: not
        # Brand mint (Assets.xcassets); macOS still prefers the user's own accent if they picked one.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Ad-hoc "sign to run locally" until there is a paid developer account (ADR 0005).
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
